AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PRM phone-home receiver (deploy in the PARTNER's own AWS account, not the
  customer's). Creates a public HTTPS endpoint (API Gateway HTTP API -> Lambda ->
  DynamoDB) that records status beacons sent by the PRM tagging templates. Each
  beacon carries the customer account id, region, resources tagged, Cost Explorer
  status, and product codes. Use the DynamoDB table (or the CloudWatch metrics) to
  build a compliance dashboard, and optionally forward to a CRM.

Parameters:
  TableName:
    Type: String
    Default: prm-phone-home
    Description: DynamoDB table to store beacons.

Resources:
  BeaconTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  ReceiverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: write-beacons
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt BeaconTable.Arn
              - Effect: Allow
                Action: [cloudwatch:PutMetricData]
                Resource: "*"

  ReceiverFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Records PRM phone-home beacons.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      MemorySize: 128
      Role: !GetAtt ReceiverRole.Arn
      Environment:
        Variables:
          TABLE: !Ref TableName
      Code:
        ZipFile: |
          import json,os,time,boto3
          d=boto3.resource("dynamodb").Table(os.environ["TABLE"])
          cw=boto3.client("cloudwatch")
          def handler(e,ctx):
           try:b=json.loads(e.get("body") or "{}")
           except Exception:b={}
           acct=str(b.get("account","unknown"));reg=str(b.get("region",""))
           now=str(int(time.time()))
           item={"pk":"ACCT#"+acct,"sk":reg+"#"+now,"account":acct,"region":reg,
            "event":str(b.get("event","")),"tagged":int(b.get("tagged",0) or 0),
            "ceEnabled":bool(b.get("ceEnabled",False)),"codes":b.get("codes") or [],
            "ts":now}
           try:d.put_item(Item=item)
           except Exception as x:print("put failed",x)
           try:
            cw.put_metric_data(Namespace="PRM/PhoneHome",MetricData=[
             {"MetricName":"ResourcesTagged","Value":item["tagged"],"Dimensions":[{"Name":"Account","Value":acct}]},
             {"MetricName":"CostExplorerEnabled","Value":1 if item["ceEnabled"] else 0,"Dimensions":[{"Name":"Account","Value":acct}]}])
           except Exception as x:print("metric failed",x)
           return {"statusCode":200,"headers":{"Content-Type":"application/json"},"body":json.dumps({"ok":True})}

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: prm-phone-home
      ProtocolType: HTTP
      Target: !GetAtt ReceiverFunction.Arn

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReceiverFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  PhoneHomeUrl:
    Description: Pass this to the tagging templates' PhoneHomeUrl parameter.
    Value: !GetAtt HttpApi.ApiEndpoint
  TableName:
    Description: DynamoDB table holding the beacons.
    Value: !Ref TableName
